name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Checks (Ubuntu)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --locked

      - name: Cargo test
        run: cargo test --workspace --locked

  lean-kernel:
    name: Lean Kernel (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build semantics kernel
        working-directory: semantics-lean
        run: lake build

  fault-matrix:
    name: Fault Matrix (Windows)
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run fault matrix
        shell: pwsh
        run: ./scripts/fault_matrix.ps1

      - name: Upload fault traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-matrix-traces
          path: demo-traces/*.trace.jsonl
          if-no-files-found: ignore
